# Redaction rules for API traffic logs.
version: 1

settings:
  mask:    { replacement: "****" }
  partial: { keep_last: 4, fill: "*" }
  hash:    { algorithm: sha256 }

# key_rules match on the NAME of a JSON key or HTTP header.
#   scope: headers | body | any
#   match: either { exact: [names...] } or { regex: "..." }
key_rules:
  - name: auth-headers
    scope: headers
    match:
      exact: [Authorization, Proxy-Authorization, X-Auth-Token, Cookie, Set-Cookie]
    action: mask

  - name: api-key-names
    scope: any
    match:
      regex: '(?i)^(x-)?api[_-]?key$'
    action: hash

  - name: secret-fields
    scope: body
    match:
      regex: '(?i)^(password|passwd|pwd|secret|client_secret|token)$'
    action: mask

  - name: card-number-fields
    scope: body
    match:
      regex: '(?i)^(card_?number|pan)$'
    action: partial

  - name: cvv-fields
    scope: body
    match:
      regex: '(?i)^(cvv|cvc|cvv2)$'
    action: remove

# value_rules match on the CONTENT of any string value, whatever its key is called.
#   validator (optional): the match only counts if the validator accepts it. Supported: luhn
value_rules:
  - name: email
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    action: hash

  - name: jwt
    # JWTs use base64url (RFC 7515), whose special characters are "-" and "_",
    # not "+" and "/". The original pattern missed JWTs containing "-" or "_",
    # and cut some off in the middle, leaking the end of the signature.
    # "+/=" are kept in case a non-standard token uses plain base64.
    pattern: 'eyJ[A-Za-z0-9_+/=-]+\.[A-Za-z0-9_+/=-]+\.[A-Za-z0-9_+/=-]*'
    action: mask

  - name: credit-card
    # Cards are often written in groups: "4111 1111 1111 1111", "5555-5555-5555-4444",
    # "3782 822463 10005". Allow one space or dash between digits.
    # The Luhn validator still rejects random numbers.
    pattern: '\b\d(?:[ -]?\d){12,18}\b'
    validator: luhn
    action: partial

  # A secret written inside free text, e.g. "login attempt password=hunter2".
  # Key rules can't see it (it's not a key), so we match "name=value" or "name: value".
  # The whole match is masked, including the name.
  - name: secret-in-text
    pattern: '(?i)\b(?:password|passwd|pwd|secret|client_secret|token)\s*[:=]\s*[^\s&,;"]+'
    action: mask

  - name: api-key-prefix
    pattern: '\bsk_(?:live|test)_[A-Za-z0-9]+\b'
    action: mask
